name: CI - Testes Node.js

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        run: npm audit --audit-level=high

      - name: Validar sintaxe JavaScript
        run: |
          find src -type f -name '*.js' -exec node --check {} \;

      - name: Executar testes
        run: npm test

  docker-build:
    name: Validar imagem Docker
    runs-on: ubuntu-latest
    needs: testes

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t agenda-saude-tacaratu:teste .
